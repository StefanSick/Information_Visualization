[project]
name = "housing-affordability-europe"
version = "0.3.0"
description = "Merges Eurostat and ECB data into a country x year x age x sex panel on housing affordability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "truststore>=0.9",  # uses the Windows/macOS certificate store (company networks)
]

[tool.uv]
package = false
link-mode = "copy"  # OneDrive folders don't support uv's default hardlinks
